services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: solarscope
      APP_ENV: development
      JWT_SECRET: dev_secret_change_in_production_min_64_chars_here_12345678
      CORS_ORIGINS: '["http://localhost:3000"]'
      LOG_LEVEL: INFO
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - upload_data:/tmp/solarscope_uploads

  worker:
    build: ./backend
    command: python -m app.workers.main
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: solarscope
      JWT_SECRET: dev_secret_change_in_production_min_64_chars_here_12345678
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - upload_data:/tmp/solarscope_uploads

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  upload_data:
